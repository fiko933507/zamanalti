name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Align Expo dependencies
        run: npx expo install --fix --non-interactive
      - name: Typecheck
        run: npm run typecheck
